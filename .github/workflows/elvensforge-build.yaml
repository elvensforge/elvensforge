# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: ./out

jobs:
  # Please do not rename this job
  build-project:
    name: build elvensforge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static Next.js site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ github.ref_name == 'UAT' && 'https://home-5021050840.app-ionos.space' || inputs.site-url }}
          NEXT_PUBLIC_DEPLOYMENT_ENV: ${{ github.ref_name == 'UAT' && 'uat' || 'production' }}
        run: npm run build

      - name: Verify static export
        run: |
          test -f ./out/index.html
          echo "Static export generated successfully"
          ls -la ./out

      - name: Prevent UAT search indexing at the HTTP layer
        if: github.ref_name == 'UAT'
        run: |
          cat >> ./out/.htaccess <<'EOF'
          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          EOF

      # Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 77ae0a8a-6441-4567-9e2f-ab08e93a4242
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/config.yaml
          action: upload
